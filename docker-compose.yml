services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
      - CORS_ORIGINS=*
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/faiss_db:/app/faiss_db
      - ./backend/metadata.json:/app/metadata.json
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}
    container_name: chatbot-frontend
    restart: always
    ports:
      - "8015:8015"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hf_cache:
